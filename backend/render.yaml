# Render.com deployment configuration
services:
  - type: web
    name: mushroom-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash prestart.sh && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mushroom-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://mushroom-app.vercel.app,https://localhost:3000
      - key: DEBUG
        value: false
      - key: ENVIRONMENT
        value: production

databases:
  - name: mushroom-db
    plan: free
    databaseName: mushroom
    user: mushroom_user
